<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 442' width='760' height='442' role='img' aria-label='Bar chart. Leaks stopped: in browser 66 of 100, hosted 84 of 100, judgment model 87 of 100; Safe prompts flagged by mistake: in browser 25 of 100, hosted 21 of 100, judgment model 25 of 100.' font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Bar chart. Leaks stopped: in browser 66 of 100, hosted 84 of 100, judgment model 87 of 100; Safe prompts flagged by mistake: in browser 25 of 100, hosted 21 of 100, judgment model 25 of 100.</title><rect x='0.5' y='0.5' width='759' height='441' rx='12' fill='#1a1a19' stroke='#383835'/><text x='28.0' y='42.0' font-size='17' font-weight='600' fill='#ffffff' text-anchor='start'>How many leaks get stopped, and how many safe prompts get flagged?</text><text x='28.0' y='64.0' font-size='13' font-weight='400' fill='#c3c2b7' text-anchor='start'>Out of every 100 messages of each kind, on 189 test messages. Hosted model: average of 3 runs.</text><rect x='28' y='82' width='12' height='12' rx='3' fill='#199e70'/><text x='46.0' y='93.0' font-size='12.5' font-weight='400' fill='#c3c2b7' text-anchor='start'>Small model, in browser</text><rect x='228' y='82' width='12' height='12' rx='3' fill='#3987e5'/><text x='246.0' y='93.0' font-size='12.5' font-weight='400' fill='#c3c2b7' text-anchor='start'>Bigger model, hosted (DeepSeek)</text><rect x='458' y='82' width='12' height='12' rx='3' fill='#008300'/><text x='476.0' y='93.0' font-size='12.5' font-weight='400' fill='#c3c2b7' text-anchor='start'>Judgment model (TypeSafe Jev)</text><text x='28.0' y='134.0' font-size='14' font-weight='600' fill='#ffffff' text-anchor='start'>Leaks stopped</text><text x='136.2' y='134.0' font-size='12' font-weight='400' fill='#898781' text-anchor='start'>higher is better</text><line x1='150.0' y1='146.0' x2='150.0' y2='234.0' stroke='#383835' stroke-width='1'/><line x1='277.5' y1='146.0' x2='277.5' y2='234.0' stroke='#2c2c2a' stroke-width='1'/><line x1='405.0' y1='146.0' x2='405.0' y2='234.0' stroke='#2c2c2a' stroke-width='1'/><line x1='532.5' y1='146.0' x2='532.5' y2='234.0' stroke='#2c2c2a' stroke-width='1'/><line x1='660.0' y1='146.0' x2='660.0' y2='234.0' stroke='#2c2c2a' stroke-width='1'/><text x='28.0' y='166.5' font-size='13' font-weight='400' fill='#c3c2b7' text-anchor='start'>In browser</text><path d='M150.0,152.0 H481.1 A4,4 0 0 1 485.1,156.0 V168.0 A4,4 0 0 1 481.1,172.0 H150.0 Z' fill='#199e70'/><text x='495.1' y='166.5' font-size='13' font-weight='600' fill='#ffffff' text-anchor='start'>66 of 100</text><text x='28.0' y='194.5' font-size='13' font-weight='400' fill='#c3c2b7' text-anchor='start'>Hosted LLM</text><path d='M150.0,180.0 H572.7 A4,4 0 0 1 576.7,184.0 V196.0 A4,4 0 0 1 572.7,200.0 H150.0 Z' fill='#3987e5'/><text x='586.7' y='194.5' font-size='13' font-weight='600' fill='#ffffff' text-anchor='start'>84 of 100</text><text x='28.0' y='222.5' font-size='13' font-weight='400' fill='#c3c2b7' text-anchor='start'>Judgment model</text><path d='M150.0,208.0 H589.9 A4,4 0 0 1 593.9,212.0 V224.0 A4,4 0 0 1 589.9,228.0 H150.0 Z' fill='#008300'/><text x='603.9' y='222.5' font-size='13' font-weight='600' fill='#ffffff' text-anchor='start'>87 of 100</text><text x='28.0' y='264.0' font-size='14' font-weight='600' fill='#ffffff' text-anchor='start'>Safe prompts flagged by mistake</text><text x='269.4' y='264.0' font-size='12' font-weight='400' fill='#898781' text-anchor='start'>lower is better</text><line x1='150.0' y1='276.0' x2='150.0' y2='364.0' stroke='#383835' stroke-width='1'/><line x1='277.5' y1='276.0' x2='277.5' y2='364.0' stroke='#2c2c2a' stroke-width='1'/><line x1='405.0' y1='276.0' x2='405.0' y2='364.0' stroke='#2c2c2a' stroke-width='1'/><line x1='532.5' y1='276.0' x2='532.5' y2='364.0' stroke='#2c2c2a' stroke-width='1'/><line x1='660.0' y1='276.0' x2='660.0' y2='364.0' stroke='#2c2c2a' stroke-width='1'/><text x='28.0' y='296.5' font-size='13' font-weight='400' fill='#c3c2b7' text-anchor='start'>In browser</text><path d='M150.0,282.0 H272.0 A4,4 0 0 1 276.0,286.0 V298.0 A4,4 0 0 1 272.0,302.0 H150.0 Z' fill='#199e70'/><text x='286.0' y='296.5' font-size='13' font-weight='600' fill='#ffffff' text-anchor='start'>25 of 100</text><text x='28.0' y='324.5' font-size='13' font-weight='400' fill='#c3c2b7' text-anchor='start'>Hosted LLM</text><path d='M150.0,310.0 H253.1 A4,4 0 0 1 257.1,314.0 V326.0 A4,4 0 0 1 253.1,330.0 H150.0 Z' fill='#3987e5'/><text x='267.1' y='324.5' font-size='13' font-weight='600' fill='#ffffff' text-anchor='start'>21 of 100</text><text x='28.0' y='352.5' font-size='13' font-weight='400' fill='#c3c2b7' text-anchor='start'>Judgment model</text><path d='M150.0,338.0 H274.0 A4,4 0 0 1 278.0,342.0 V354.0 A4,4 0 0 1 274.0,358.0 H150.0 Z' fill='#008300'/><text x='288.0' y='352.5' font-size='13' font-weight='600' fill='#ffffff' text-anchor='start'>25 of 100</text><text x='150.0' y='378.0' font-size='11.5' font-weight='400' fill='#898781' text-anchor='middle'>0</text><text x='277.5' y='378.0' font-size='11.5' font-weight='400' fill='#898781' text-anchor='middle'>25</text><text x='405.0' y='378.0' font-size='11.5' font-weight='400' fill='#898781' text-anchor='middle'>50</text><text x='532.5' y='378.0' font-size='11.5' font-weight='400' fill='#898781' text-anchor='middle'>75</text><text x='660.0' y='378.0' font-size='11.5' font-weight='400' fill='#898781' text-anchor='middle'>100</text><text x='28.0' y='408.0' font-size='11.5' font-weight='400' fill='#898781' text-anchor='start'>Stopped = every confidential item in the message was caught. In the browser, the pattern rules do most of that work.</text><text x='28.0' y='425.0' font-size='11.5' font-weight='400' fill='#898781' text-anchor='start'>The judgment model has a dial the others do not: turned up, it stops 78 in 100 and flags only 12.</text></svg>
