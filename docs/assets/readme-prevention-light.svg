<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 380' width='760' height='380' role='img' aria-label='Bar chart. Leaks stopped: in browser 66 of 100, hosted 84 of 100; Safe prompts flagged by mistake: in browser 25 of 100, hosted 21 of 100.' font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Bar chart. Leaks stopped: in browser 66 of 100, hosted 84 of 100; Safe prompts flagged by mistake: in browser 25 of 100, hosted 21 of 100.</title><rect x='0.5' y='0.5' width='759' height='379' rx='12' fill='#fcfcfb' stroke='#e1e0d9'/><text x='28.0' y='42.0' font-size='17' font-weight='600' fill='#0b0b0b' text-anchor='start'>How many leaks get stopped, and how many safe prompts get flagged?</text><text x='28.0' y='64.0' font-size='13' font-weight='400' fill='#52514e' text-anchor='start'>Out of every 100 messages of each kind, on 189 test messages. Hosted model: average of 3 runs.</text><rect x='28' y='82' width='12' height='12' rx='3' fill='#1baf7a'/><text x='46.0' y='93.0' font-size='12.5' font-weight='400' fill='#52514e' text-anchor='start'>Small model, in the browser (Qwen3.5 2B)</text><rect x='328' y='82' width='12' height='12' rx='3' fill='#2a78d6'/><text x='346.0' y='93.0' font-size='12.5' font-weight='400' fill='#52514e' text-anchor='start'>Bigger model, hosted (DeepSeek V4 Flash)</text><text x='28.0' y='134.0' font-size='14' font-weight='600' fill='#0b0b0b' text-anchor='start'>Leaks stopped</text><text x='136.2' y='134.0' font-size='12' font-weight='400' fill='#898781' text-anchor='start'>higher is better</text><line x1='150.0' y1='146.0' x2='150.0' y2='206.0' stroke='#c3c2b7' stroke-width='1'/><line x1='277.5' y1='146.0' x2='277.5' y2='206.0' stroke='#e1e0d9' stroke-width='1'/><line x1='405.0' y1='146.0' x2='405.0' y2='206.0' stroke='#e1e0d9' stroke-width='1'/><line x1='532.5' y1='146.0' x2='532.5' y2='206.0' stroke='#e1e0d9' stroke-width='1'/><line x1='660.0' y1='146.0' x2='660.0' y2='206.0' stroke='#e1e0d9' stroke-width='1'/><text x='28.0' y='166.5' font-size='13' font-weight='400' fill='#52514e' text-anchor='start'>In browser</text><path d='M150.0,152.0 H481.1 A4,4 0 0 1 485.1,156.0 V168.0 A4,4 0 0 1 481.1,172.0 H150.0 Z' fill='#1baf7a'/><text x='495.1' y='166.5' font-size='13' font-weight='600' fill='#0b0b0b' text-anchor='start'>66 of 100</text><text x='28.0' y='194.5' font-size='13' font-weight='400' fill='#52514e' text-anchor='start'>Hosted</text><path d='M150.0,180.0 H572.7 A4,4 0 0 1 576.7,184.0 V196.0 A4,4 0 0 1 572.7,200.0 H150.0 Z' fill='#2a78d6'/><text x='586.7' y='194.5' font-size='13' font-weight='600' fill='#0b0b0b' text-anchor='start'>84 of 100</text><text x='28.0' y='240.0' font-size='14' font-weight='600' fill='#0b0b0b' text-anchor='start'>Safe prompts flagged by mistake</text><text x='269.4' y='240.0' font-size='12' font-weight='400' fill='#898781' text-anchor='start'>lower is better</text><line x1='150.0' y1='252.0' x2='150.0' y2='312.0' stroke='#c3c2b7' stroke-width='1'/><line x1='277.5' y1='252.0' x2='277.5' y2='312.0' stroke='#e1e0d9' stroke-width='1'/><line x1='405.0' y1='252.0' x2='405.0' y2='312.0' stroke='#e1e0d9' stroke-width='1'/><line x1='532.5' y1='252.0' x2='532.5' y2='312.0' stroke='#e1e0d9' stroke-width='1'/><line x1='660.0' y1='252.0' x2='660.0' y2='312.0' stroke='#e1e0d9' stroke-width='1'/><text x='28.0' y='272.5' font-size='13' font-weight='400' fill='#52514e' text-anchor='start'>In browser</text><path d='M150.0,258.0 H272.0 A4,4 0 0 1 276.0,262.0 V274.0 A4,4 0 0 1 272.0,278.0 H150.0 Z' fill='#1baf7a'/><text x='286.0' y='272.5' font-size='13' font-weight='600' fill='#0b0b0b' text-anchor='start'>25 of 100</text><text x='28.0' y='300.5' font-size='13' font-weight='400' fill='#52514e' text-anchor='start'>Hosted</text><path d='M150.0,286.0 H253.1 A4,4 0 0 1 257.1,290.0 V302.0 A4,4 0 0 1 253.1,306.0 H150.0 Z' fill='#2a78d6'/><text x='267.1' y='300.5' font-size='13' font-weight='600' fill='#0b0b0b' text-anchor='start'>21 of 100</text><text x='150.0' y='330.