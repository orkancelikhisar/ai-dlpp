</style><text x="24" y="32" font-size="17" font-weight="700" class="ink">WebGPU returns wrong logits on 3 of 4 loadable rungs</text><text x="24" y="54" font-size="12" class="mut">max |wasm &#8722; webgpu| over the raw logits tensor. Identical feeds, fresh page per rung per provider.</text><text x="24" y="70" font-size="12" class="mut">No error is raised on any of them.</text><text x="228" y="102" font-size="12.5" text-anchor="end" class="ink mono">gliner-pii-edge</text><text x="228" y="115" font-size="10.5" text-anchor="end" class="mut">token_level</text><rect x="240" y="91" width="330" height="20" class="gridf" opacity="0.25" rx="3"/><rect x="240" y="91" width="86.1" height="20" class="bad" rx="3"/><text x="335.1" y="106" font-size="12.5" font-weight="600" class="bad">8.352</text><text x="228" y="144" font-size="12.5" text-anchor="end" class="ink mono">gliner-pii-edge-uint8</text><text x="228" y="157" font-size="10.5" text-anchor="end" class="mut">token_level</text><rect x="240" y="133" width="330" height="20" class="gridf" opacity="0.25" rx="3"/><rect x="240" y="133" width="83.9" height="20" class="bad" rx="3"/><text x="332.9" y="148" font-size="12.5" font-weight="600" class="bad">8.134</text><text x="228" y="186" font-size="12.5" text-anchor="end" class="ink mono">gliner-pii-base</text><text x="228" y="199" font-size="10.5" text-anchor="end" class="mut">markerV0</text><rect x="240" y="175" width="330" height="20" class="gridf" opacity="0.25" rx="3"/><rect x="240" y="175" width="3.0" height="20" class="good" rx="3"/><text x="252.0" y="190" font-size="12.5" font-weight="600" class="good">0.000  exact &#8212; the control</text><text x="228" y="228" font-size="12.5" text-anchor="end" class="ink mono">gliner-pii-base-uint8</text><text x="228" y="241" font-size="10.5" text-anchor="end" class="mut">markerV0</text><rect x="240" y="217" width="330" height="20" class="gridf" opacity="0.25" rx="3"/><rect x="240" y="217" width="311.0" height="20" class="bad" rx="3"/><text x="560.0" y="232" font-size="12.5" font-weight="600" class="bad">30.154</text><line x1="240" y1="80" x2="240" y2="248" class="grid" stroke-width="1"/><rect x="24" y="268" width="712" height="66" class="good" opacity="0.08" rx="6"/><text x="40" y="292" font-size="12.5" class="ink"><tspan font-weight="700">A collapse, not drift.</tspan> base-uint8 logits span [&#8722;30.46, +2.05] on wasm and [&#8722;0.36, &#8722;0.16] on</text><text x="40" y="311" font-size="12.5" class="ink">webgpu &#8212; sigmoid &#8776; 0.46 for every word. gliner-pii-base agreeing exactly under the same page</text><text x="40" y="326" font-size="12.5" class="ink">code is the control proving the harness is not the cause.</text></svg>