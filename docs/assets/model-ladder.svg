</style><text x="24" y="32" font-size="17" font-weight="700" class="ink">The precision ladder is four rungs, not six</text><text x="24" y="54" font-size="12" class="mut">Both fp16 exports fail to create a session in the browser AND under onnxruntime-node.</text><text x="24" y="72" font-size="12" class="mut">Same failure on both runtimes means an upstream export defect, not a runtime bug.</text><text x="220" y="106" font-size="12" text-anchor="end" class="ink mono">gliner-pii-edge</text><rect x="232" y="93" width="89.0" height="17" class="b1" rx="3" opacity="0.9"/><text x="330.0" y="106" font-size="11.5" class="mut" font-weight="400">172.7 MB</text><text x="220" y="140" font-size="12" text-anchor="end" class="ink mono">gliner-pii-edge-fp16</text><rect x="232" y="127" width="44.7" height="17" class="bad" rx="3" opacity="0.35"/><text x="285.7" y="140" font-size="11.5" class="bad" font-weight="600">86.6 MB  &#8212;  DOES NOT LOAD</text><text x="220" y="174" font-size="12" text-anchor="end" class="ink mono">gliner-pii-edge-uint8</text><rect x="232" y="161" width="22.5" height="17" class="b1" rx="3" opacity="0.9"/><text x="263.5" y="174" font-size="11.5" class="mut" font-weight="400">43.7 MB</text><text x="220" y="208" font-size="12" text-anchor="end" class="ink mono">gliner-pii-base</text><rect x="232" y="195" width="326.9" height="17" class="b1" rx="3" opacity="0.9"/><text x="567.9" y="208" font-size="11.5" class="mut" font-weight="400">634.0 MB</text><text x="220" y="242" font-size="12" text-anchor="end" class="ink mono">gliner-pii-base-fp16</text><rect x="232" y="229" width="163.7" height="17" class="bad" rx="3" opacity="0.35"/><text x="404.7" y="242" font-size="11.5" class="bad" font-weight="600">317.5 MB  &#8212;  DOES NOT LOAD</text><text x="220" y="276" font-size="12" text-anchor="end" class="ink mono">gliner-pii-base-uint8</text><rect x="232" y="263" width="96.7" height="17" class="b1" rx="3" opacity="0.9"/><text x="337.7" y="276" font-size="11.5" class="mut" font-weight="400">187.6 MB</text><text x="24" y="308" font-size="11" class="mut mono">Type Error: Type (tensor(float16)) of output arg (Cast_1_output_0) does not match expected type (tensor(float)).</text><text x="24" y="328" font-size="11.5" class="mut">Weights hash correctly against the pinned manifest and the graphs parse &#8212; the defect is in the published export.</text></svg>