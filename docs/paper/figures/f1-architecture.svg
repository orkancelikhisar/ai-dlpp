<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 200' width='700' height='200' role='img'><rect x='0.0' y='0.0' width='700.0' height='200.0' fill='#ffffff' stroke='none' rx='0' /><defs><marker id='ah' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#6b7280'/></marker></defs><text x='10.0' y='14.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' text-anchor='start' fill='#1f2937' font-weight='bold'  style=''>Compile once in the cloud; detect every prompt locally</text><rect x='10.0' y='26.0' width='118.0' height='60.0' fill='#f3f4f6' stroke='#9ca3af' rx='4' /><text x='69.0' y='41.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2937' font-weight='bold'  style=''>Policy document</text><text x='69.0' y='54.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>natural language,</text><text x='69.0' y='65.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>provider clauses</text><text x='69.0' y='76.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>(p-fin: 5,320 bytes)</text><rect x='150.0' y='26.0' width='118.0' height='60.0' fill='#fff7ed' stroke='#e0782f' rx='4' /><text x='209.0' y='41.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2937' font-weight='bold'  style=''>Compiler</text><text x='209.0' y='54.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>frontier model,</text><text x='209.0' y='65.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>compile-time only —</text><text x='209.0' y='76.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>touches no user data</text><rect x='290.0' y='26.0' width='118.0' height='60.0' fill='#f3f4f6' stroke='#9ca3af' rx='4' /><text x='349.0' y='41.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2937' font-weight='bold'  style=''>Policy IR</text><text x='349.0' y='54.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>8 entity types · 10 rules</text><text x='349.0' y='65.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>1 semantic predicate (message)</text><text x='349.0' y='76.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>actions per provider</text><line x1='128' y1='56' x2='150' y2='56' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><line x1='268' y1='56' x2='290' y2='56' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><line x1='430.0' y1='20.0' x2='430.0' y2='190.0' stroke='#d1d5db' stroke-width='1' stroke-dasharray='4,3'/><text x='436.0' y='20.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.5' text-anchor='start' fill='#6b7280' font-weight='normal'  style=''>runtime — in the browser, per prompt</text><rect x='440.0' y='30.0' width='78.0' height='46.0' fill='#eef2ff' stroke='#818cf8' rx='4' /><text x='479.0' y='45.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2937' font-weight='bold'  style=''>Tier 0</text><text x='479.0' y='58.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>regex + validators</text><text x='479.0' y='69.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>sync</text><rect x='526.0' y='30.0' width='78.0' height='46.0' fill='#eef2ff' stroke='#818cf8' rx='4' /><text x='565.0' y='45.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2937' font-weight='bold'  style=''>Tier 1</text><text x='565.0' y='58.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>span tagger</text><text x='565.0' y='69.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>ONNX</text><rect x='612.0' y='30.0' width='78.0' height='46.0' fill='#eef2ff' stroke='#818cf8' rx='4' /><text x='651.0' y='45.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2937' font-weight='bold'  style=''>Tier 2</text><text x='651.0' y='58.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>LLM judge</text><text x='651.0' y='69.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>WebLLM / WebGPU</text><line x1='408' y1='56' x2='440' y2='53' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><line x1='518' y1='53' x2='526' y2='53' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><line x1='604' y1='53' x2='612' y2='53' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><rect x='440.0' y='96.0' width='250.0' height='48.0' fill='#ecfdf5' stroke='#34d399' rx='4' /><text x='565.0' y='111.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#1f2937' font-weight='bold'  style=''>Cluster-strictest action</text><text x='565.0' y='124.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>block > redact > pseudonymize > allow</text><text x='565.0' y='135.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#6b7280' font-weight='normal'  style=''>pseudonyms rehydrated in the reply</text><line x1='565' y1='76' x2='565' y2='96' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><rect x='10.0' y='108.0' width='398.0' height='80.0' fill='#fafafa' stroke='#d1d5db' rx='4' /><text x='18.0' y='124.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='start' fill='#1f2937' font-weight='bold'  style=''>What this paper measures — the tier-2 judge, two ways to build it, two hardware classes</text><text x='18.0' y='140.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='start' fill='#6b7280' font-weight='normal'  style=''>Compiled judge: one predicate from the IR, ~300-token prompt.   Policy-in-context (B): the whole policy in the prompt, 1,410 tokens.</text><rect x='18.0' y='150.0' width='9.0' height='9.0' fill='#8d97a3' stroke='none' rx='1.5' /><text x='31.0' y='158.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='start' fill='#1f2937' font-weight='normal'  style=''>in-browser arms: Qwen3.5-2B, Ministral-3-3B, Qwen3-4B, Phi-4-mini · 4-bit · WebGPU · 8,192 ctx · shippable</text><rect x='18.0' y='166.0' width='9.0' height='9.0' fill='#2b6cb0' stroke='none' rx='1.5' /><text x='31.0' y='174.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='start' fill='#1f2937' font-weight='normal'  style=''>capability-ceiling arms: six open-weight hosted models (27–120 B where published), providers pinned · non-shippable, same method</text><rect x='18.0' y='178.0' width='9.0' height='9.0' fill='#6b3fa0' stroke='none' rx='1.5' /><text x='31.0' y='186.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='start' fill='#1f2937' font-weight='normal'  style=''>+ one ceiling model with mandatory reasoning, thinking ON at two token caps</text></svg>