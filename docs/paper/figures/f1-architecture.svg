if' font-size='8.3' text-anchor='middle' fill='#52514e' font-weight='normal' >frontier model,</text><text x='209.0' y='65.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#52514e' font-weight='normal' >compile-time only —</text><text x='209.0' y='76.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#52514e' font-weight='normal' >touches no user data</text><rect x='290.0' y='26.0' width='118.0' height='60.0' fill='#f3f4f6' stroke='#9ca3af' rx='4' fill-opacity='1.0'/><text x='349.0' y='41.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' text-anchor='middle' fill='#0b0b0b' font-weight='bold' >Policy IR</text><text x='349.0' y='54.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#52514e' font-weight='normal' >8 entity types · 10 rules</text><text x='349.0' y='65.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#52514e' font-weight='normal' >1 semantic predicate (message)</text><text x='349.0' y='76.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.3' text-anchor='middle' fill='#52514e' font-weight='normal' >actions per provider</text><line x1='128' y1='56' x2='150' y2='56' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><line x1='268' y1='56' x2='290' y2='56' stroke='#6b7280' stroke-width='1.4' marker-end='url(#ah)'/><line x1='430.0' y1='20.0' x2='430.0' y2='200.0' stroke='#d1d5db' stroke-width='1' stroke-dasharray='4,3'/><text x='436.0' y='20.0' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='8.5' text-anchor='start' fill='#52514e' font-weight='normal' >runtime — in the browser, per prompt</text><rect x='440.0' y='30.0' width='78.0' height='46.0' fill='#eef2ff' stroke='#818cf8' rx='4' fill-opacity='1.0'/><text x='479.0' y='45.0' font-family='Helvetica Neue, Helveti